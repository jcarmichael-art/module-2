<!DOCTYPE html>
<html lang="en">

<title>Full Screen Colors</title>
<head>




    <style>
        body {
            background-color: #000000;            
        }
        

    </style>

    <style>
        
        .image-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        .image-container img {
            width: 100%;
            height: Auto;
            display: block;
        }
        .text-overlay {
        position: absolute;
        top: 80%;                 /* Push down to the middle */
        left: 50%;                /* Push right to the middle */
        transform: translate(-50%, -50%); /* Perfectly center the text alignment */
        color: rgb(165, 147, 13);             /* Text color */
        font-family: Courier;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* Makes text readable against light images */
        text-align: center;
        }
    </style>
    <style>
        .gen-text {
            
        }
    </style>
</head>
<body>

  <div class="image-container">
    <img src="bass_reeves1.png" alt="bass_reeves1">
    <div class="text-overlay"> <h1> Bass Reeves </h1> <h4>The Invincible Marshal</h4></div>
  </div>


</body>
</html>
